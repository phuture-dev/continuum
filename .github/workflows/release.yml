name: release

on:
  pull_request:
    types: [ closed ]
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:

    # Only dependency update pull requests from develop that were actually merged
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      contains(github.event.pull_request.labels.*.name, 'dependencies')

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: 0

    - name: Compute next minor version
      id: version
      run: |
        if [ -n "$(git tag --points-at "$MERGE_COMMIT")" ]; then
          echo "::notice::Merge commit $MERGE_COMMIT is already tagged, skipping release."
          exit 0
        fi

        latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
        latest_tag=${latest_tag:-v0.0.0}

        IFS='.' read -r major minor _ <<< "${latest_tag#v}"
        next_tag="v${major}.$((minor + 1)).0"

        echo "Tagging $MERGE_COMMIT as $next_tag (previous: $latest_tag)" >> "$GITHUB_STEP_SUMMARY"
        echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

    - name: Create tag and pre-release
      if: steps.version.outputs.tag != ''
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        gh release create "$TAG" \
          --target "$MERGE_COMMIT" \
          --title "$TAG" \
          --generate-notes \
          --prerelease
